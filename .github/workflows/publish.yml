name: publish

on:
  push:
    branches:
      - main
    paths:
      - "*/PKGBUILD"

jobs:
  find-packages:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.packages.outputs.count }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find updated packages
        id: packages
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          packages=$(.github/scripts/find-changed-packages.sh "$BASE_SHA" "$HEAD_SHA")
          echo "count=$(jq length <<<"$packages")" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.pkgbuild }}
    needs: find-packages
    if: ${{ needs.find-packages.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        pkgbuild: ${{ fromJSON(needs.find-packages.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkgbuild }}
          pkgbuild: ${{ matrix.pkgbuild }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
